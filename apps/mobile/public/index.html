<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: la página llega hasta debajo de la barra de estado y de la isla, y
      env(safe-area-inset-*) da los márgenes reales (react-native-safe-area-context los lee en web).
      Así el panel de Inicio se dibuja detrás de la hora, como en la app nativa.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!--
      Agregada a la pantalla de inicio del iPhone: se abre sin la interfaz de Safari y la barra de
      estado queda transparente, encima del panel de Inicio. iOS elige solo el color de la hora y la
      batería según lo que hay detrás (oscuro sobre el fondo claro, claro sobre el panel).
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vuelto" />
    <!-- display: standalone vive en el manifest: sin él, iOS 26 deja los botones de Safari (atrás, compartir, recargar). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- En Safari común, la barra toma el color del panel de arriba (heroBg de theme.ts). -->
    <meta name="theme-color" content="#0E2A21" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B100E" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        /*
          En la web app instalada del iPhone, 100% y 100dvh miden menos que la pantalla (en un
          iPhone 17 Pro: 812 de 874 pt) y dejan un hueco abajo. lvh sí llega al borde de abajo.
        */
        height: 100lvh;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100lvh;
        flex: 1;
      }
      /*
        Que se sienta como una app y no como una página: sin selección de texto al mantener apretado
        (aparecía el menú Copiar / Consultar / Traducir sobre la barra de pestañas), sin el menú de
        mantener apretado en links e imágenes, sin el destello gris al tocar y sin rebote de la página.
        Los campos de texto siguen siendo seleccionables.
      */
      html,
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      input,
      textarea,
      [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Fondo mientras carga y en el rebote: el canvas de cada tema (theme.ts), no blanco. */
      html,
      body {
        background-color: #f2f6f3;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b100e;
        }
      }
    </style>
  </head>

  <body>
    <noscript>Necesitás activar JavaScript para usar Vuelto.</noscript>
    <div id="root"></div>
  </body>
</html>
